name: TestFlight

# Manual only, and deliberately so: macOS runners bill at 10x Linux minutes, and
# an iOS build is a release act rather than a side effect of a push. Run it from
# the Actions tab, or push an `ios-vX.Y.Z` tag at the commit you mean — the tag
# is then the repo's own permanent record that iOS was brought up to that
# version.
#
# Even then, the Mac is never the first to hear about a problem: a Linux gate
# runs first and the macOS job refuses to start unless it passes. Her words, to
# another project, 18 August 2026: "I don't want to pay for mac os runners if
# things fail already in android."
#
# ⚠ **THE STEP SEQUENCE IS COPIED FROM astropractise, WHICH COPIED IT FROM
# practiseapp, WHERE IT TOOK SEVEN ATTEMPTS.** Every comment marked with a
# reason records a real failure on a real runner. Do not tidy them away; this
# file is the only place that knowledge is written down.
#
# ── Shared across her whole Apple account, already in ~/keystores ────────────
#
#   * App Store Connect API key — AuthKey_32VS9C8RF8.p8
#   * Apple Distribution certificate — theourgia-ios-dist.p12, and its password
#     ⚠ A distribution certificate is per-ACCOUNT, not per-app: the one made
#     for Theourgia signs this app too. It expires 2027-08-06; after that,
#     remake it and refresh the secrets.
#   * The team: L25T4F2NJ2
#
# ── Specific to Astrolabe, created once ─────────────────────────────────────
#
#   1. The bundle id `com.shrutivtuber.astrolabe`, registered at
#      developer.apple.com. ⚠ Tick Push Notifications while registering it —
#      adding the capability later means regenerating the profile.
#   2. An App Store provisioning profile named exactly `Astrolabe`, against
#      that bundle id and the EXISTING distribution certificate. The name is
#      written in two places — PROVISIONING_PROFILE_SPECIFIER in
#      ios/Runner.xcodeproj/project.pbxproj, and the ExportOptions plist below.
#      A mismatch fails at export with an error that never mentions the profile.
#   3. The app record in App Store Connect. ⚠ The one step the API cannot do.
#
# ── The Swiss Ephemeris ─────────────────────────────────────────────────────
#
# This app links the Swiss Ephemeris, dual-licensed AGPL-3.0 or commercial.
# ⚠ Unlike her other apps, that question is already settled here and settled
# the easy way: **Astrolabe is itself AGPL-3.0 and its source is public**, so
# the obligation that attaches on distribution is already met. Shipping to
# TestFlight testers or to the App Store changes nothing. See LICENSE, and
# ASSETS-LICENCE for why the artwork is separate and why that is compatible.

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

env:
  # Keep in sync with the app's own toolchain.
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "21"
  TEAM_ID: L25T4F2NJ2
  BUNDLE_ID: com.shrutivtuber.astrolabe
  PROFILE_NAME: Astrolabe

jobs:
  # Nothing may reach the Mac that Linux could have refused for a tenth of the
  # price. This is the whole of CI in one job — analyse, tests, and the Android
  # RELEASE build, because the release compiler catches what the tests cannot
  # and a tree that cannot build for Android has no business billing an hour of
  # Mac time to fail for iOS.
  gate:
    name: The Linux gate before the Mac
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ⚠ The same gate her other apps use. A formatting difference is not a
      # bug, but an unformatted tree makes every later diff noisy, and finding
      # that out on a macOS runner costs ten times as much as finding it here.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze
      - run: flutter test

      # ⚠ google-services.json is gitignored — it identifies her Firebase
      # project — so CI has none and the Google Services Gradle plugin fails
      # the build. The secret carries it; without it this step is the first
      # thing to go red, with a message about the plugin rather than the file.
      - name: Firebase configuration for the Android build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES_JSON is not set; the Android build cannot sign in to Firebase"
            exit 1
          fi

      - run: flutter build apk --release

  testflight:
    name: Build and upload to TestFlight
    needs: gate
    # ⚠ macos-26, not macos-15. Apple's upload validation requires the iOS 26
    # SDK (Xcode 26+). practiseapp's attempt 7 compiled and signed an entire
    # app on macos-15 and was refused only for its 18.5 SDK — toolchain, not
    # code, and an hour of Mac time to find out.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Where every Apple tool looks for API keys. Still needed with manual
      # signing: the export step's upload authenticates with it.
      #
      # ⚠ printf '%s', not echo. The .p8 must land byte-for-byte; echo can add
      # a newline and mangle the PEM.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # ⚠ Secrets arrive through `env:`, never interpolated straight into the
      # shell — a secret containing a quote or a backtick would otherwise be
      # executed rather than assigned.
      - name: Install the signing identity
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          echo "$IOS_DIST_P12" | base64 -d > /tmp/dist.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import /tmp/dist.p12 -k build.keychain \
            -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          # ⚠ Without this, codesign stops to ask permission — on a machine with
          # nobody at it, which reads as a hang until the job times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k ci-keychain build.keychain > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_B64" | base64 -d > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/astrolabe-appstore.mobileprovision"
          rm /tmp/dist.p12

      # ⚠ --no-codesign as well as --config-only: even config-only runs
      # Flutter's signing preflight, and practiseapp's FIRST dispatch failed
      # exactly there, before any compilation began.
      - name: Flutter build (config only)
        run: |
          flutter pub get
          flutter build ios --release --config-only --no-codesign

      # ⚠ -destination generic/platform=iOS: without it the runner Mac plans to
      # run the app on ITSELF — Apple-silicon Macs pose as iPads — and attempt 2
      # failed there.
      #
      # ⚠ NO signing flags on this command line. Command-line overrides hit
      # EVERY target, and plugin pods cannot take a provisioning profile:
      # attempt 5 failed exactly there. The manual signing lives in the Runner
      # target's own Release configuration, where only the Runner sees it.
      - name: Archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive archive

      # method app-store-connect + destination upload: the export hands the
      # build straight to TestFlight, with no separate uploader tool.
      - name: Export and upload
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ env.TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key><string>${{ env.PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Remove keys and keychain from the runner
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_*.p8
          security delete-keychain build.keychain || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/astrolabe-appstore.mobileprovision"
